name: recud
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: 6.2.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  overlay_support: 2.1.0
  loading_animation_widget: 1.3.0
  flutter_launcher_icons: 0.14.2
  flutter_native_splash: 2.4.3
  flutter_inappwebview: 6.1.5
  image_picker: 1.1.2
  permission_handler: 12.0.1
  get_thumbnail_video: 0.7.3
  path_provider: 2.1.5
  video_player: 2.10.0
  in_app_purchase: 3.2.1
  intl: 0.20.2
  record: 6.0.0
  just_audio: 0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: truedevicelocale
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: "assets/images/aisncuicon.png"

flutter_native_splash: 
  background_image: "assets/images/zxopcijiqd.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/